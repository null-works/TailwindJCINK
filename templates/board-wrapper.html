  <style>
    /* Hide old JCINK elements */
    #logostrip, #submenu, #userlinks, .newstext, #top,

    /* Member visibility classes */
    .acp-0, .mcp-0 { display: none !important; }
    .g-2 { display: inline-flex !important; }
    .m-2 { display: none !important; }

    /* Layout */
    .site-wrapper { max-width: 1300px; margin: 0 auto; padding: 0 1rem; }
    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg-1); border-bottom: 1px solid var(--bg-3);
      padding: 0.75rem 0;
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .site-logo { font-weight: 600; font-size: 1.125rem; color: var(--text-clear); text-decoration: none; }
    .site-logo:hover { color: var(--accent-1); }

    /* Nav controls */
    .nav-controls { display: flex; align-items: center; gap: 0.5rem; }
    .nav-btn {
      padding: 0.5rem; border-radius: 0.375rem; background: none; border: none;
      color: var(--text-medCon); cursor: pointer; transition: color 0.2s;
    }
    .nav-btn:hover { color: var(--accent-1); }
    .nav-link {
      padding: 0.5rem 0.75rem; border-radius: 0.375rem; font-size: 0.875rem;
      color: var(--text-medCon); text-decoration: none; transition: all 0.2s;
    }
    .nav-link:hover { color: var(--accent-1); background: var(--bg-2); }
    .nav-link-primary { background: var(--accent-1); color: white; }
    .nav-link-primary:hover { background: var(--accent-2); color: white; }

    /* Theme icons */
    .theme-icon { width: 1.25rem; height: 1.25rem; }
    .theme-light .icon-sun { display: none; }
    .theme-light .icon-moon { display: block; }
    .theme-dark .icon-sun { display: block; }
    .theme-dark .icon-moon { display: none; }

    /* Main content */
    .site-main { padding: 1.5rem 0; min-height: calc(100vh - 200px); }
    .site-nav { margin-bottom: 1rem; font-size: 0.875rem; color: var(--text-medCon); }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--bg-3); padding: 1.5rem 0;
      font-size: 0.75rem; color: var(--text-loCon);
    }
    .footer-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; }
    .footer-links { display: flex; gap: 1rem; }
    .footer-links a { color: var(--text-loCon); text-decoration: none; }
    .footer-links a:hover { color: var(--accent-1); }

    /* Mobile menu */
    .mobile-toggle { display: none; }
    .mobile-menu { display: none; }

    @media (max-width: 768px) {
      .desktop-only { display: none !important; }
      .mobile-toggle { display: flex; }

      .mobile-menu {
        display: none; position: fixed; top: 0; right: 0; bottom: 0;
        width: 280px; max-width: 80vw; background: var(--bg-1);
        border-left: 1px solid var(--bg-3); padding: 1rem; z-index: 100;
        transform: translateX(100%); transition: transform 0.3s;
      }
      .mobile-menu.open { display: block; transform: translateX(0); }
      .mobile-menu-header { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
      .mobile-menu a {
        display: block; padding: 0.75rem; border-radius: 0.375rem;
        color: var(--text-medCon); text-decoration: none;
      }
      .mobile-menu a:hover { background: var(--bg-2); color: var(--accent-1); }

      .mobile-backdrop {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99;
      }
      .mobile-backdrop.open { display: block; }
    }
  </style>
</head>

  <script>
    (function() {
      // Theme toggle
      var html = document.documentElement;
      var saved = localStorage.getItem('theme') || 'theme-light';
      html.className = saved;

      function toggle() {
        var next = html.className === 'theme-dark' ? 'theme-light' : 'theme-dark';
        html.className = next;
        localStorage.setItem('theme', next);
      }

      document.getElementById('theme-toggle')?.addEventListener('click', toggle);
      document.getElementById('theme-toggle-mobile')?.addEventListener('click', toggle);

      // Mobile menu
      var menu = document.getElementById('mobile-menu');
      var backdrop = document.getElementById('mobile-backdrop');

      function openMenu() {
        menu?.classList.add('open');
        backdrop?.classList.add('open');
      }
      function closeMenu() {
        menu?.classList.remove('open');
        backdrop?.classList.remove('open');
      }

      document.getElementById('mobile-toggle')?.addEventListener('click', openMenu);
      document.getElementById('mobile-close')?.addEventListener('click', closeMenu);
      backdrop?.addEventListener('click', closeMenu);
    })();
  </script>
