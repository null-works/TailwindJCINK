<!DOCTYPE html>
<html>
<head>
<title><% TITLE %></title>
<% CSS %>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        forum: {
          bg: 'var(--forum-bg)',
          surface: 'var(--forum-surface)',
          border: 'var(--forum-border)',
          text: 'var(--forum-text)',
          muted: 'var(--forum-muted)',
          accent: 'var(--forum-accent)',
        }
      },
      maxWidth: {
        'forum': '1200px',
      }
    }
  }
}
</script>
</head>
<body class="bg-forum-bg text-forum-text">
<div id="wrapper" class="max-w-forum mx-auto px-4 py-4">
  <% BOARD HEADER %>
  <div id="navigation" class="mb-4">
    <% NAVIGATION %>
  </div>
  <% DSHOUTBOX %>
  <% BOARD %>
  <div id="skin_selector" class="my-4">
    <% SKIN_SELECTOR %>
  </div>
  <% COPYRIGHT %>
</div>
</body>
</html>
