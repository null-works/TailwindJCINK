  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            forum: {
              bg: 'var(--bg-1)',
              surface: 'var(--bg-2)',
              border: 'var(--bg-3)',
              dark: 'var(--bg-4)',
              text: 'var(--text-clear)',
              muted: 'var(--text-medCon)',
              subtle: 'var(--text-loCon)',
              accent: 'var(--accent-1)',
              'accent-hover': 'var(--accent-2)',
            }
          },
          maxWidth: {
            'forum': '1300px',
          }
        }
      }
    }
  </script>
  <% JAVASCRIPT %>
  <style>
    /* Hide old JCINK default elements from BOARD HEADER */
    #logostrip, #submenu, #userlinks, .newstext, #top,
    #ipbwrapper > table:first-child,
    body > table:first-of-type { display: none !important; }

    /* Ensure only one header shows */
    .site-header ~ .site-header { display: none !important; }

    /* Hide/show based on member status */
    .acp-0, .mcp-0 { display: none !important; }
    .g-2 { display: inline-flex !important; }
    .m-2 { display: none !important; }

    /* Theme icon visibility (CSS-controlled) */
    .theme-light .theme-icon-light { display: none; }
    .theme-light .theme-icon-dark { display: block; }
    .theme-dark .theme-icon-light { display: block; }
    .theme-dark .theme-icon-dark { display: none; }

    /* ========== MOBILE OPTIMIZATION ========== */

    /* CSS-only mobile menu using details/summary */
    .mobile-menu-details {
      position: relative;
    }
    .mobile-menu-details summary {
      list-style: none;
      cursor: pointer;
    }
    .mobile-menu-details summary::-webkit-details-marker {
      display: none;
    }
    .mobile-menu-details .menu-panel {
      position: absolute;
      top: 100%;
      right: 0;
      width: 280px;
      max-width: 80vw;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
      background: var(--bg-1);
      border: 1px solid var(--bg-3);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 50;
    }

    /* Touch-friendly targets (44px minimum) */
    @media (max-width: 768px) {
      .touch-target {
        min-width: 44px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* Hide desktop user controls on mobile */
      .desktop-controls { display: none !important; }

      /* Show mobile menu */
      .mobile-menu-details { display: block !important; }
    }

    @media (min-width: 769px) {
      /* Hide mobile menu on desktop */
      .mobile-menu-details { display: none !important; }
    }

    /* ========== JCINK CONTENT STYLES ========== */
    /* Note: Front page (forum rows, categories) are now handled by HTML Templates with Tailwind.
       These styles handle other pages like topics, profiles, etc. */

    @media (max-width: 768px) {
      /* Container padding */
      #wrapper {
        padding-left: 8px !important;
        padding-right: 8px !important;
      }

      /* Post content - readable on mobile */
      .postcolor, .post1, .post2, .signature {
        font-size: 14px !important;
        line-height: 1.6 !important;
        word-wrap: break-word !important;
        overflow-wrap: break-word !important;
      }

      /* Images in posts - prevent overflow */
      .postcolor img, .post1 img, .post2 img {
        max-width: 100% !important;
        height: auto !important;
      }

      /* Breadcrumbs */
      #navstrip {
        font-size: 12px !important;
        word-wrap: break-word !important;
      }

      /* Board stats - stack on mobile */
      #boardstats td {
        display: block !important;
        width: 100% !important;
        padding: 8px !important;
        text-align: center !important;
      }

      /* Topic tables - horizontal scroll fallback */
      .tableborder {
        display: block !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
      }
    }
  </style>
</head>
