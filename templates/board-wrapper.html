  <!-- Theme Toggle Script -->
  <script>
    (function() {
      const html = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const iconLight = document.getElementById('theme-icon-light');
      const iconDark = document.getElementById('theme-icon-dark');

      function setTheme(theme) {
        localStorage.setItem('theme', theme);
        html.className = theme;
        if (theme === 'theme-dark') {
          iconLight.classList.remove('hidden');
          iconDark.classList.add('hidden');
        } else {
          iconLight.classList.add('hidden');
          iconDark.classList.remove('hidden');
        }
      }

      // Load saved theme
      const saved = localStorage.getItem('theme') || 'theme-light';
      setTheme(saved);

      toggle.addEventListener('click', function() {
        const current = localStorage.getItem('theme') || 'theme-light';
        setTheme(current === 'theme-dark' ? 'theme-light' : 'theme-dark');
      });
    })();

    // Mobile nav toggle
    (function() {
      const btn = document.getElementById('mobile-menu-btn');
      const nav = document.getElementById('mobile-nav');
      const close = document.getElementById('mobile-nav-close');

      btn.addEventListener('click', () => nav.classList.remove('hidden'));
      close.addEventListener('click', () => nav.classList.add('hidden'));
      nav.addEventListener('click', (e) => {
        if (e.target === nav) nav.classList.add('hidden');
      });
    })();

    // Hide badges with 0 count
    document.querySelectorAll('.num-0').forEach(el => el.style.display = 'none');
  </script>
