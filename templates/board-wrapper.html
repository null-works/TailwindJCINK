  <% CSS %>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            forum: {
              bg: 'var(--bg-1)',
              surface: 'var(--bg-2)',
              border: 'var(--bg-3)',
              dark: 'var(--bg-4)',
              text: 'var(--text-clear)',
              muted: 'var(--text-medCon)',
              subtle: 'var(--text-loCon)',
              accent: 'var(--accent-1)',
              'accent-hover': 'var(--accent-2)',
            }
          },
          maxWidth: {
            'forum': '1300px',
          }
        }
      }
    }
  </script>
  <% JAVASCRIPT %>
  <style>
    /* Hide old JCINK default elements from BOARD HEADER */
    #logostrip, #submenu, #userlinks, .newstext, #top,
    #ipbwrapper > table:first-child,
    body > table:first-of-type { display: none !important; }

    /* Ensure only one header shows */
    .site-header ~ .site-header { display: none !important; }

    /* Hide/show based on member status */
    .acp-0, .mcp-0 { display: none !important; }
    .g-2 { display: inline-flex !important; }
    .m-2 { display: none !important; }

    /* ========== THEME COLOR DEFINITIONS ========== */
    html.theme-light {
      --bg-1: #ffffff !important;
      --bg-2: #f9fafb !important;
      --bg-3: #e5e7eb !important;
      --bg-4: #f3f4f6 !important;
      --text-clear: #111827 !important;
      --text-medCon: #374151 !important;
      --text-loCon: #6b7280 !important;
      --accent-1: #6366f1 !important;
      --accent-2: #4f46e5 !important;
    }
    html.theme-dark {
      --bg-1: #0f0f1a !important;
      --bg-2: #12121f !important;
      --bg-3: #1a1a2e !important;
      --bg-4: #0a0a12 !important;
      --text-clear: #f9fafb !important;
      --text-medCon: #e5e7eb !important;
      --text-loCon: #9ca3af !important;
      --accent-1: #818cf8 !important;
      --accent-2: #a5b4fc !important;
    }

    /* ========== MOBILE OPTIMIZATION ========== */

    /* Mobile menu panel */
    .mobile-menu {
      transform: translateX(100%);
      transition: transform 0.3s ease-in-out;
    }
    .mobile-menu.open {
      transform: translateX(0);
    }

    /* Mobile menu backdrop */
    .mobile-backdrop {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
    }
    .mobile-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    /* Touch-friendly targets (44px minimum) */
    @media (max-width: 768px) {
      .touch-target {
        min-width: 44px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* Hide desktop user controls on mobile */
      .desktop-controls { display: none !important; }

      /* Show mobile menu button */
      .mobile-menu-btn { display: flex !important; }
    }

    @media (min-width: 769px) {
      /* Hide mobile elements on desktop */
      .mobile-menu-btn { display: none !important; }
      .mobile-menu { display: none !important; }
      .mobile-backdrop { display: none !important; }
    }

    /* ========== JCINK TABLE RESPONSIVE ========== */
    @media (max-width: 768px) {
      /* Force JCINK tables to be responsive */
      #wrapper table,
      .tablefill,
      .ipbtable,
      #idx,
      .maintitle + table,
      table[width] {
        width: 100% !important;
        display: block !important;
        overflow-x: auto !important;
      }

      /* Stack table cells on mobile */
      #wrapper td,
      #wrapper th {
        display: block !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }

      /* Hide less important columns on mobile */
      .row4 > td:nth-child(2),
      .row4 > td:nth-child(3) {
        display: none !important;
      }

      /* Forum row adjustments */
      .row1, .row2, .row3, .row4 {
        padding: 12px !important;
      }

      /* Category headers */
      .maintitle {
        font-size: 14px !important;
        padding: 10px 12px !important;
      }

      /* Post content */
      .postcolor, .post1, .post2 {
        font-size: 15px !important;
        line-height: 1.6 !important;
      }

      /* Breadcrumb wrap */
      #navstrip {
        font-size: 12px !important;
        word-wrap: break-word !important;
      }
    }

    /* ========== JCINK MOBILE MODE OVERRIDES ========== */
    #mobile #wrapper {
      padding: 8px !important;
    }

    #mobile .maintitle {
      font-size: 13px !important;
    }
  </style>
</head>

  <!-- Theme Toggle & Mobile Menu Script -->
  <script>
    (function() {
      // ========== THEME TOGGLE ==========
      const html = document.documentElement;

      function setTheme(theme) {
        localStorage.setItem('theme', theme);
        html.className = theme;

        // Update all theme icons (desktop + mobile)
        document.querySelectorAll('.theme-icon-light, #theme-icon-light').forEach(el => {
          el.classList.toggle('hidden', theme !== 'theme-dark');
        });
        document.querySelectorAll('.theme-icon-dark, #theme-icon-dark').forEach(el => {
          el.classList.toggle('hidden', theme === 'theme-dark');
        });
      }

      function toggleTheme() {
        const current = localStorage.getItem('theme') || 'theme-light';
        setTheme(current === 'theme-dark' ? 'theme-light' : 'theme-dark');
      }

      // Initialize theme
      const saved = localStorage.getItem('theme') || 'theme-light';
      setTheme(saved);

      // Desktop theme toggle
      const themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', toggleTheme);
      }

      // Mobile theme toggle
      const themeToggleMobile = document.getElementById('theme-toggle-mobile');
      if (themeToggleMobile) {
        themeToggleMobile.addEventListener('click', toggleTheme);
      }

      // ========== MOBILE MENU ==========
      const menuToggle = document.getElementById('mobile-menu-toggle');
      const mobileMenu = document.getElementById('mobile-menu');
      const backdrop = document.getElementById('mobile-backdrop');
      const hamburgerIcon = menuToggle?.querySelector('.hamburger-icon');
      const closeIcon = menuToggle?.querySelector('.close-icon');

      function openMenu() {
        mobileMenu?.classList.add('open');
        backdrop?.classList.add('open');
        hamburgerIcon?.classList.add('hidden');
        closeIcon?.classList.remove('hidden');
        menuToggle?.setAttribute('aria-expanded', 'true');
        menuToggle?.setAttribute('aria-label', 'Close Menu');
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        mobileMenu?.classList.remove('open');
        backdrop?.classList.remove('open');
        hamburgerIcon?.classList.remove('hidden');
        closeIcon?.classList.add('hidden');
        menuToggle?.setAttribute('aria-expanded', 'false');
        menuToggle?.setAttribute('aria-label', 'Open Menu');
        document.body.style.overflow = '';
      }

      if (menuToggle) {
        menuToggle.addEventListener('click', function() {
          const isOpen = mobileMenu?.classList.contains('open');
          isOpen ? closeMenu() : openMenu();
        });
      }

      // Close menu when clicking backdrop
      if (backdrop) {
        backdrop.addEventListener('click', closeMenu);
      }

      // Close menu when clicking a link inside
      mobileMenu?.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', closeMenu);
      });

      // Close menu on escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && mobileMenu?.classList.contains('open')) {
          closeMenu();
        }
      });

      // Close menu on resize to desktop
      window.addEventListener('resize', function() {
        if (window.innerWidth > 768 && mobileMenu?.classList.contains('open')) {
          closeMenu();
        }
      });
    })();
  </script>

</body>
</html>
