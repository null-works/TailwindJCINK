<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><% TITLE %></title>
  <% CSS %>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            forum: {
              bg: 'var(--bg-1)',
              surface: 'var(--bg-2)',
              border: 'var(--bg-3)',
              dark: 'var(--bg-4)',
              text: 'var(--text-clear)',
              muted: 'var(--text-medCon)',
              subtle: 'var(--text-loCon)',
              accent: 'var(--accent-1)',
              'accent-hover': 'var(--accent-2)',
            }
          },
          maxWidth: {
            'forum': '1300px',
          }
        }
      }
    }
  </script>
  <% JAVASCRIPT %>
</head>

<body id="<!-- |input_act| -->" class="bg-forum-dark text-forum-muted min-h-screen">

  <!-- Header -->
  <header class="bg-forum-bg border-b border-forum-border">
    <div class="max-w-forum mx-auto px-4 py-4">
      <% BOARD HEADER %>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="bg-forum-surface border-b border-forum-border">
    <div class="max-w-forum mx-auto px-4 py-2">
      <% NAVIGATION %>
    </div>
  </nav>

  <!-- User Bar -->
  <div class="bg-forum-bg border-b border-forum-border">
    <div class="max-w-forum mx-auto px-4 py-2 flex items-center justify-between text-sm">
      <div class="flex items-center gap-4">
        <span class="g-<!-- |g_id| -->" style="display:none;">
          <a href="index.php?act=Login&CODE=00" class="text-forum-accent hover:text-forum-accent-hover">Login</a>
          <span class="text-forum-subtle mx-2">|</span>
          <a href="index.php?act=Reg&CODE=00" class="text-forum-accent hover:text-forum-accent-hover">Register</a>
        </span>
        <span class="m-<!-- |g_id| --> flex items-center gap-4">
          <span>Logged in as: <a href="index.php?showuser=<!-- |id| -->" class="text-forum-accent hover:text-forum-accent-hover"><!-- |prefix| --><!-- |name| --><!-- |suffix| --></a></span>
          <a href="index.php?act=Login&CODE=03&key=<!-- |auth_key| -->" class="text-forum-muted hover:text-forum-accent">Log Out</a>
          <a href="admin.php" target="_blank" class="acp-<!-- |g_access_cp| --> text-forum-muted hover:text-forum-accent">Admin CP</a>
          <a href="index.php?act=modcp" class="mcp-<!-- |g_is_supmod| --> text-forum-muted hover:text-forum-accent">Mod CP</a>
        </span>
      </div>
      <div class="flex items-center gap-4">
        <a href="index.php?act=UserCP&CODE=00" class="text-forum-accent hover:text-forum-accent-hover">My Controls</a>
        <a href="index.php?act=Msg&CODE=01" class="text-forum-accent hover:text-forum-accent-hover"><!-- |new_msg| --> New Messages</a>
        <a href="index.php?act=Search&CODE=getactive" class="text-forum-accent hover:text-forum-accent-hover">View New Posts</a>
        <a href="index.php?act=UserCP&CODE=alerts" class="text-forum-accent hover:text-forum-accent-hover">Alerts (<!-- |new_alerts| -->)</a>
      </div>
      <!-- Theme Toggle -->
      <button id="theme-toggle" class="p-2 text-forum-muted hover:text-forum-accent" title="Toggle Theme">
        <svg id="theme-icon-light" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
        <svg id="theme-icon-dark" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="min-h-screen">
    <div id="wrapper" class="max-w-forum mx-auto px-4 py-6">
      <% BOARD %>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-forum-bg border-t border-forum-border py-6">
    <div class="max-w-forum mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div id="skin_selector"><% SKIN_SELECTOR %></div>
      <div class="text-xs text-forum-subtle"><% COPYRIGHT %></div>
      <div class="flex gap-4 text-sm">
        <a href="index.php?act=Login&CODE=06" class="text-forum-subtle hover:text-forum-accent">Delete Cookies</a>
        <a href="index.php?act=Login&CODE=05" class="text-forum-subtle hover:text-forum-accent">Mark All Read</a>
      </div>
    </div>
  </footer>

  <!-- Theme Toggle Script -->
  <script>
    (function() {
      const html = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const iconLight = document.getElementById('theme-icon-light');
      const iconDark = document.getElementById('theme-icon-dark');
      function setTheme(theme) {
        localStorage.setItem('theme', theme);
        html.className = theme;
        if (theme === 'theme-dark') {
          iconLight.classList.remove('hidden');
          iconDark.classList.add('hidden');
        } else {
          iconLight.classList.add('hidden');
          iconDark.classList.remove('hidden');
        }
      }
      const saved = localStorage.getItem('theme') || 'theme-light';
      setTheme(saved);
      if (toggle) {
        toggle.addEventListener('click', function() {
          const current = localStorage.getItem('theme') || 'theme-light';
          setTheme(current === 'theme-dark' ? 'theme-light' : 'theme-dark');
        });
      }
    })();
  </script>

  <style>
    .acp-0, .mcp-0 { display: none !important; }
    .g-2 { display: inline !important; }
    .m-2 { display: none !important; }
  </style>

</body>
</html>
