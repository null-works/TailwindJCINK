<!--
  JCINK Redirect Row Template

  This template goes in: ACP > Skins & Templates > HTML Templates > Redirect Row

  This is used for redirect forums - forums that link to external URLs.

  JCINK Variables Used:
  - <!-- |forum_id| --> : Forum ID
  - <!-- |name| --> : Forum name with link
  - <!-- |description| --> : Forum description
  - <!-- |redirect_url| --> : The redirect URL
  - <!-- |img_new_post| --> : Forum status icon
  - <!-- |redirect_hits| --> : Number of times the redirect has been clicked
-->

<div class="category-row group" id="redirect-<!-- |forum_id| -->">
  <!-- Color Marker Bar - Orange for redirects -->
  <div class="category-marker bg-orange-500"></div>

  <!-- Redirect Icon -->
  <div class="category-icon">
    <!-- |img_new_post| -->
  </div>

  <!-- Redirect Info -->
  <div class="category-info">
    <div class="category-title inline-flex items-center gap-2">
      <!-- |name| -->
      <svg class="w-4 h-4 text-forum-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>
    </div>
    <p class="category-description">
      <!-- |description| -->
    </p>
    <span class="inline-flex items-center gap-1 mt-2 text-xs text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-900/20 px-2 py-0.5 rounded">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
      </svg>
      External Link
    </span>
  </div>

  <!-- Redirect Stats -->
  <div class="category-stats hidden lg:flex">
    <div class="text-center">
      <div class="font-semibold text-forum-text"><!-- |redirect_hits| --></div>
      <div class="text-xs">Clicks</div>
    </div>
  </div>

  <!-- Empty Last Post Area (redirects don't have posts) -->
  <div class="category-last-post hidden md:flex items-center justify-center text-sm text-forum-muted">
    <span class="italic">Redirect Forum</span>
  </div>
</div>
