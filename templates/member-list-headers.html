<!--
  JCINK Member List Headers Template

  This template goes in: ACP > Skins & Templates > HTML Templates > Member List Headers

  JCINK Variables Used:
  - <%MEMBER_ROWS%> : The member list rows
  - <%PAGINATION%> : Page navigation
  - <%SORT_OPTIONS%> : Sorting options
  - <%SEARCH_FORM%> : Member search form
  - <%TOTAL_MEMBERS%> : Total member count
  - <%LETTER_LINKS%> : A-Z letter navigation
-->

<div class="member-list-wrapper">
  <!-- Page Header -->
  <div class="forum-card mb-4">
    <div class="forum-card-header">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold flex items-center gap-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          Member List
        </h1>
        <span class="text-white/80 text-sm"><%TOTAL_MEMBERS%> Members</span>
      </div>
    </div>
  </div>

  <!-- Search & Filter Bar -->
  <div class="forum-card mb-4">
    <div class="forum-card-body">
      <div class="flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
        <!-- Search Form -->
        <div class="flex-1">
          <%SEARCH_FORM%>
        </div>

        <!-- Sort Options -->
        <div class="flex items-center gap-2 text-sm">
          <span class="text-forum-muted">Sort by:</span>
          <%SORT_OPTIONS%>
        </div>
      </div>

      <!-- Letter Navigation -->
      <div class="mt-4 pt-4 border-t border-forum-border">
        <div class="flex flex-wrap gap-1 justify-center">
          <%LETTER_LINKS%>
        </div>
      </div>
    </div>
  </div>

  <!-- Member List Table -->
  <div class="forum-card">
    <!-- Table Header -->
    <div class="hidden md:grid grid-cols-12 gap-4 px-5 py-3 bg-slate-50 dark:bg-slate-800/50 border-b border-forum-border text-sm font-medium text-forum-muted">
      <div class="col-span-4">Member</div>
      <div class="col-span-2 text-center">Group</div>
      <div class="col-span-2 text-center">Posts</div>
      <div class="col-span-2 text-center">Joined</div>
      <div class="col-span-2 text-center">Last Active</div>
    </div>

    <!-- Member Rows -->
    <div class="divide-y divide-forum-border">
      <%MEMBER_ROWS%>
    </div>

    <!-- Pagination Footer -->
    <div class="forum-card-footer flex items-center justify-center">
      <nav class="pagination">
        <%PAGINATION%>
      </nav>
    </div>
  </div>
</div>
