<div class="category-row group <!-- |class_new_post| -->" id="forum-<!-- |forum_id| -->">
  <div class="category-marker bg-category-1"></div>

  <div class="category-icon">
    <!-- |img_new_post| -->
  </div>

  <div class="category-info">
    <!-- |name| -->
    <p class="category-description"><!-- |description| --></p>
    <div class="mt-2 text-sm"><!-- |subforums| --></div>
    <div class="text-xs text-forum-muted mt-1"><!-- |moderators| --></div>
  </div>

  <div class="category-stats hidden lg:flex">
    <div class="text-center">
      <div class="font-semibold text-forum-text"><!-- |topics| --></div>
      <div class="text-xs">Topics</div>
    </div>
    <div class="text-center">
      <div class="font-semibold text-forum-text"><!-- |replies| --></div>
      <div class="text-xs">Posts</div>
    </div>
  </div>

  <div class="category-last-post hidden md:block">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-700 flex-shrink-0 overflow-hidden">
        <img src="<!-- |last_poster_avatar_url| -->" alt="" class="w-full h-full object-cover">
      </div>
      <div class="min-w-0 flex-1">
        <a href="<!-- |last_topic_url| -->" class="text-sm font-medium text-forum-text hover:text-forum-accent block truncate">
          <!-- |last_topic_text| -->
        </a>
        <p class="text-xs text-forum-muted mt-0.5">
          by <!-- |last_poster| -->
          <br><!-- |last_post| -->
        </p>
      </div>
    </div>
  </div>
</div>
