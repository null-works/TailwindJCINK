<!--
  JCINK Board Wrapper - Simple Version
  If the full version fails to save, use this minimal version
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><%BOARD_NAME%></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <%CSS%>
  <style>
    :root {
      --forum-bg: #f1f5f9;
      --forum-surface: #ffffff;
      --forum-border: #e2e8f0;
      --forum-text: #1e293b;
      --forum-muted: #64748b;
      --forum-accent: #0ea5e9;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--forum-bg); color: var(--forum-text); }
    a { color: var(--forum-accent); }
    a:hover { color: #0284c7; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="<%BOARD_URL%>" class="text-xl font-bold text-slate-800"><%BOARD_NAME%></a>
      <nav class="flex gap-4 text-sm">
        <a href="<%BOARD_URL%>" class="hover:text-sky-600">Home</a>
        <a href="<%SEARCH%>" class="hover:text-sky-600">Search</a>
        <a href="<%MEMBERLIST%>" class="hover:text-sky-600">Members</a>
        <a href="<%HELP%>" class="hover:text-sky-600">Help</a>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-6">
    <%BOARD%>
  </main>
  <footer class="bg-white border-t border-slate-200 mt-8">
    <div class="max-w-6xl mx-auto px-4 py-6 text-center text-sm text-slate-500">
      &copy; <%BOARD_NAME%> | Powered by JCINK
    </div>
  </footer>
</body>
</html>
