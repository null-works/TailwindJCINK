<!--
  JCINK Topic List Template

  This template goes in: ACP > Skins & Templates > HTML Templates > Topic List Templates > Topic List Wrapper

  JCINK Variables Used:
  - <%FORUM_NAME%> : Current forum name
  - <%FORUM_DESC%> : Forum description
  - <%TOPICS%> : The topic rows
  - <%PAGINATION%> : Page navigation
  - <%NEW_TOPIC_BTN%> : Button to create new topic
  - <%FORUM_RULES%> : Forum rules (if set)
  - <%MODERATORS%> : List of forum moderators
  - <%SORT_OPTIONS%> : Topic sorting options
-->

<div class="topic-list-wrapper">
  <!-- Forum Header -->
  <div class="forum-card mb-4">
    <div class="forum-card-header">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold"><%FORUM_NAME%></h1>
        <div class="flex items-center gap-2">
          <%NEW_TOPIC_BTN%>
          <!--
          <a href="#" class="btn btn-primary">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            New Topic
          </a>
          -->
        </div>
      </div>
      <p class="text-white/80 text-sm mt-1"><%FORUM_DESC%></p>
    </div>
  </div>

  <!-- Forum Rules (if any) -->
  <div class="alert alert-info mb-4" id="forum-rules">
    <%FORUM_RULES%>
  </div>

  <!-- Topic List Header -->
  <div class="forum-card">
    <!-- Column Headers -->
    <div class="px-5 py-3 bg-slate-50 dark:bg-slate-800/50 border-b border-forum-border">
      <div class="flex items-center gap-4 text-sm font-medium text-forum-text-muted">
        <div class="w-10"></div>
        <div class="flex-1">Topic</div>
        <div class="hidden lg:block w-[120px] text-center">Stats</div>
        <div class="hidden md:block w-[180px] text-right">Last Post</div>
      </div>
    </div>

    <!-- Topics -->
    <div class="divide-y divide-forum-border">
      <%TOPICS%>
    </div>

    <!-- Pagination Footer -->
    <div class="forum-card-footer flex items-center justify-between">
      <div class="text-sm text-forum-text-muted">
        <%SORT_OPTIONS%>
      </div>
      <nav class="pagination">
        <%PAGINATION%>
      </nav>
    </div>
  </div>

  <!-- Moderators -->
  <div class="mt-4 text-sm text-forum-text-muted">
    <span class="font-medium">Moderators:</span> <%MODERATORS%>
  </div>
</div>
