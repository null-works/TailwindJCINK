<!--
  JCINK Board Wrapper - No CDN Version
  Use this if JCINK blocks the Tailwind CDN script
  Requires: Copy dist/theme.css into your Stylesheet
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><%BOARD_NAME%></title>
  <%BOARD_HEADER%>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <%CSS%>
</head>
<body class="bg-forum-bg text-forum-text min-h-screen flex flex-col">

  <header class="forum-nav sticky top-0" style="z-index:200;">
    <div class="forum-nav-inner">
      <a href="<%BOARD_URL%>" class="forum-nav-brand"><%BOARD_NAME%></a>
      <nav class="forum-nav-links hidden md:flex">
        <a href="<%BOARD_URL%>" class="forum-nav-link active">Home</a>
        <a href="<%SEARCH%>" class="forum-nav-link">Search</a>
        <a href="<%MEMBERLIST%>" class="forum-nav-link">Members</a>
        <a href="<%CALENDAR%>" class="forum-nav-link">Calendar</a>
        <a href="<%HELP%>" class="forum-nav-link">Help</a>
      </nav>
      <div class="flex items-center gap-2">
        <%LOGGED_IN%>
        <%LOGGED_OUT%>
      </div>
    </div>
  </header>

  <main id="main-content" class="flex-1">
    <div class="forum-container">
      <%BOARD%>

      <section class="stats-box mt-6">
        <h2 class="text-lg font-semibold mb-4">Forum Statistics</h2>
        <%STATS_GRID%>
      </section>

      <section class="online-users mt-4">
        <h2 class="online-users-header">Users Online</h2>
        <div class="online-users-list"><%ONLINE_LIST%></div>
        <p class="text-sm text-forum-text-muted mt-3">Current time: <%CLOCK_TIME%></p>
      </section>
    </div>
  </main>

  <footer class="forum-footer">
    <div class="forum-footer-inner">
      <div class="forum-footer-links">
        <a href="<%BOARD_URL%>">Home</a>
        <a href="<%HELP%>">Help</a>
        <a href="<%SEARCH%>">Search</a>
        <a href="<%MEMBERLIST%>">Members</a>
      </div>
      <div class="forum-footer-copyright">
        <p>&copy; <%BOARD_NAME%>. Powered by JCINK.</p>
      </div>
    </div>
  </footer>

</body>
</html>
