<!--
  JCINK Post Display Template

  This template goes in: ACP > Skins & Templates > HTML Templates > Topic View Templates > Post Row

  JCINK Variables Used:
  - <%POST_ID%> : Post ID
  - <%POST_CONTENT%> : The post content
  - <%POST_DATE%> : When the post was made
  - <%POST_NUMBER%> : Post number in topic
  - <%POST_LINK%> : Direct link to this post
  - <%MEMBER_ID%> : Member ID
  - <%MEMBER_NAME%> : Member's display name
  - <%MEMBER_LINK%> : Link to member profile
  - <%MEMBER_AVATAR%> : Member's avatar
  - <%MEMBER_GROUP%> : Member's group name
  - <%MEMBER_GROUP_ID%> : Member's group ID
  - <%MEMBER_TITLE%> : Member's custom title
  - <%MEMBER_POSTS%> : Member's post count
  - <%MEMBER_JOINED%> : When member joined
  - <%MEMBER_REPUTATION%> : Member's reputation
  - <%MEMBER_LOCATION%> : Member's location
  - <%MEMBER_PHOTO%> : Member's photo
  - <%SIGNATURE%> : Member's signature
  - <%MINI_PROFILE%> : Complete mini profile template
  - <%EDIT_BUTTON%> : Edit post button
  - <%QUOTE_BUTTON%> : Quote post button
  - <%DELETE_BUTTON%> : Delete post button
  - <%REPORT_BUTTON%> : Report post button
  - <%IP_ADDRESS%> : IP address (if admin)
  - <%EDITED_BY%> : Edit history
  - <%MULTIQUOTE%> : Multi-quote checkbox
  - <%PROFILE_FIELDS%> : Custom profile fields
  - <%CONTACT_ICONS%> : Contact icons (PM, email, etc.)
-->

<article class="post" id="post-<%POST_ID%>">
  <!-- Mini Profile Sidebar -->
  <aside class="post-sidebar hidden md:block">
    <%MINI_PROFILE%>
  </aside>

  <!-- Post Content Area -->
  <div class="post-content">
    <!-- Post Header -->
    <header class="post-header">
      <div class="flex items-center gap-3">
        <!-- Mobile Avatar -->
        <img src="<%MEMBER_AVATAR%>" alt="<%MEMBER_NAME%>" class="w-10 h-10 rounded-full md:hidden">

        <div>
          <!-- Mobile: Show name -->
          <a href="<%MEMBER_LINK%>" class="font-semibold text-forum-text hover:text-forum-accent md:hidden">
            <%MEMBER_NAME%>
          </a>

          <!-- Post Date & Number -->
          <div class="text-sm text-forum-text-muted">
            <a href="<%POST_LINK%>" class="hover:text-forum-accent" title="Link to this post">
              <time><%POST_DATE%></time>
            </a>
            <span class="mx-2">&bull;</span>
            <a href="<%POST_LINK%>" class="hover:text-forum-accent">
              #<%POST_NUMBER%>
            </a>
          </div>
        </div>
      </div>

      <!-- Post Actions (Top) -->
      <div class="flex items-center gap-1">
        <%MULTIQUOTE%>
        <a href="<%POST_LINK%>" class="btn btn-ghost btn-sm" title="Permalink">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
          </svg>
        </a>
      </div>
    </header>

    <!-- Post Body -->
    <div class="post-body">
      <%POST_CONTENT%>
    </div>

    <!-- Edited By Notice -->
    <div class="text-xs text-forum-text-muted mt-3 italic">
      <%EDITED_BY%>
    </div>

    <!-- Signature -->
    <div class="signature">
      <%SIGNATURE%>
    </div>

    <!-- Post Footer -->
    <footer class="post-footer">
      <!-- Left Side: IP Address (admin only) -->
      <div class="text-xs text-forum-text-muted">
        <%IP_ADDRESS%>
      </div>

      <!-- Right Side: Action Buttons -->
      <div class="post-actions">
        <span class="inline-flex items-center gap-1">
          <%REPORT_BUTTON%>
          <!--
          <button class="btn btn-ghost btn-sm text-forum-text-muted" title="Report">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          </button>
          -->
        </span>

        <span class="inline-flex items-center gap-1">
          <%QUOTE_BUTTON%>
          <!--
          <button class="btn btn-ghost btn-sm" title="Quote">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
            Quote
          </button>
          -->
        </span>

        <span class="inline-flex items-center gap-1">
          <%EDIT_BUTTON%>
          <!--
          <button class="btn btn-ghost btn-sm" title="Edit">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
            Edit
          </button>
          -->
        </span>

        <span class="inline-flex items-center gap-1">
          <%DELETE_BUTTON%>
          <!--
          <button class="btn btn-ghost btn-sm text-red-600" title="Delete">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          </button>
          -->
        </span>
      </div>
    </footer>
  </div>
</article>
