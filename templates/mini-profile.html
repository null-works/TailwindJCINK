<!--
  JCINK Mini Profile Template

  This template goes in: ACP > Skins & Templates > HTML Templates > Topic View Templates > Mini Profile

  JCINK Variables Used:
  - <%MEMBER_ID%> : Member ID
  - <%MEMBER_NAME%> : Member's display name
  - <%MEMBER_LINK%> : Link to member profile
  - <%MEMBER_AVATAR%> : Member's avatar URL
  - <%MEMBER_GROUP%> : Member's group name
  - <%MEMBER_GROUP_ID%> : Member's group ID
  - <%MEMBER_TITLE%> : Member's custom title
  - <%MEMBER_POSTS%> : Member's post count
  - <%MEMBER_JOINED%> : When member joined
  - <%MEMBER_REPUTATION%> : Member's reputation
  - <%MEMBER_LOCATION%> : Member's location
  - <%MEMBER_PHOTO%> : Member's photo (if different from avatar)
  - <%ONLINE_STATUS%> : Online/Offline indicator
  - <%PM_LINK%> : Link to send PM
  - <%EMAIL_LINK%> : Link to send email
  - <%PROFILE_LINK%> : Link to full profile
  - <%WARN_LINK%> : Warning link (for mods)
  - <%PROFILE_FIELDS%> : Custom profile fields
  - <%CONTACT_ICONS%> : Contact method icons
  - <%MEMBER_PIPS%> : Group pips/stars
  - <%REPUTATION_DISPLAY%> : Reputation bar/display
-->

<div class="mini-profile" id="mini-profile-<%MEMBER_ID%>">
  <!-- Avatar -->
  <div class="relative inline-block">
    <a href="<%MEMBER_LINK%>">
      <img
        src="<%MEMBER_AVATAR%>"
        alt="<%MEMBER_NAME%>"
        class="mini-profile-avatar"
        loading="lazy"
      >
    </a>

    <!-- Online Status Indicator -->
    <div class="absolute bottom-1 right-1">
      <%ONLINE_STATUS%>
      <!--
      Online: <span class="w-4 h-4 bg-green-500 border-2 border-white dark:border-slate-800 rounded-full block" title="Online"></span>
      Offline: <span class="w-4 h-4 bg-slate-400 border-2 border-white dark:border-slate-800 rounded-full block" title="Offline"></span>
      -->
    </div>
  </div>

  <!-- Member Name -->
  <div class="mt-3">
    <a href="<%MEMBER_LINK%>" class="mini-profile-name hover:text-forum-accent transition-colors">
      <%MEMBER_NAME%>
    </a>
  </div>

  <!-- Member Group Badge -->
  <div class="mt-1">
    <%MEMBER_GROUP%>
    <!--
    Example group badges with custom styling based on group ID:
    <span class="group-badge group-badge-admin">Administrator</span>
    <span class="group-badge group-badge-mod">Moderator</span>
    <span class="group-badge group-badge-member">Member</span>
    -->
  </div>

  <!-- Custom Title -->
  <div class="text-xs text-forum-text-muted italic mt-1">
    <%MEMBER_TITLE%>
  </div>

  <!-- Member Pips/Stars -->
  <div class="mt-2 text-amber-500">
    <%MEMBER_PIPS%>
    <!--
    <span class="inline-flex gap-0.5">
      <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
      </svg>
      (repeat for each pip)
    </span>
    -->
  </div>

  <!-- Member Stats -->
  <div class="mini-profile-stats">
    <div class="flex items-center justify-center gap-1">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
      </svg>
      <span><%MEMBER_POSTS%> posts</span>
    </div>

    <div class="flex items-center justify-center gap-1">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <span>Joined <%MEMBER_JOINED%></span>
    </div>

    <!-- Location (if set) -->
    <div class="flex items-center justify-center gap-1">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span><%MEMBER_LOCATION%></span>
    </div>
  </div>

  <!-- Reputation Display -->
  <div class="mt-2">
    <%REPUTATION_DISPLAY%>
    <!--
    <div class="flex items-center justify-center gap-1 text-xs">
      <span class="text-forum-text-muted">Rep:</span>
      <span class="font-medium text-green-600">+<%MEMBER_REPUTATION%></span>
    </div>
    -->
  </div>

  <!-- Custom Profile Fields -->
  <div class="mt-2 text-xs">
    <%PROFILE_FIELDS%>
  </div>

  <!-- Contact Icons -->
  <div class="mini-profile-icons">
    <%CONTACT_ICONS%>
    <!--
    Example contact icons:
    <a href="<%PM_LINK%>" class="btn btn-ghost btn-sm p-1" title="Send PM">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </a>
    <a href="<%PROFILE_LINK%>" class="btn btn-ghost btn-sm p-1" title="View Profile">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
    </a>
    -->
  </div>

  <!-- Warn Link (Moderator only) -->
  <div class="mt-2">
    <%WARN_LINK%>
  </div>
</div>
